---
name: ci

on:
  push:
    branches:
      - master
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-and-build:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive

      - name: toolchain
        run: |
          sw_vers
          xcodebuild -version

      - name: build app
        run: scripts/build.sh

      # once, with Address Sanitizer: memory errors in the C buffers fail the build (#26)
      - name: test
        run: scripts/test.sh

      - name: verify app
        run: scripts/verify.sh

      # drive the built app's UI in a throwaway home folder (#31); runs here, never on a desktop
      - name: UI smoke tests
        run: |
          export TEST_RUNNER_NOTATIONAL_APP="$PWD/build/Notational.xcarchive/Products/Applications/Notational.app"
          xcodebuild test \
            -project UITests/NotationalUITests.xcodeproj \
            -scheme NotationalUITests \
            -derivedDataPath build/DerivedDataUI \
            -resultBundlePath build/UITestResults.xcresult

      - uses: actions/upload-artifact@v7
        with:
          name: Notational
          path: build/Notational.zip

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: |
            build/TestResults.xcresult
            build/UITestResults.xcresult
