---
name: ci

on:
  push:
    branches:
      - master
    # a change to the docs alone can't break the build (#68)
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/perf.yml'
  pull_request:
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - '.github/workflows/perf.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# build, unit tests and UI tests run side by side; only the UI tests wait for the built app (#68)
jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: toolchain
        run: |
          sw_vers
          xcodebuild -version

      # CFBundleVersion 128.<run>, so downloaded builds can be told apart (#49)
      - name: build app
        run: scripts/build.sh -quiet COMPILER_INDEX_STORE_ENABLE=NO NV_BUILD_NUMBER=128.${{ github.run_number }}

      - name: verify app
        run: scripts/verify.sh

      - uses: actions/upload-artifact@v7
        with:
          name: Notational
          path: build/Notational.zip

  # once, with Address Sanitizer: memory errors in the C buffers fail the build (#26)
  unit-tests:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - name: test
        run: scripts/test.sh -quiet COMPILER_INDEX_STORE_ENABLE=NO

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-results
          path: build/TestResults.xcresult

  # drive the built app's UI in a throwaway home folder (#31); runs here, never on a desktop
  ui-tests:
    needs: build
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6

      - uses: actions/download-artifact@v7
        with:
          name: Notational
          path: build

      - name: UI smoke tests
        run: |
          ditto -x -k build/Notational.zip build/app
          export TEST_RUNNER_NOTATIONAL_APP="$PWD/build/app/Notational.app"
          xcodebuild test \
            -project UITests/NotationalUITests.xcodeproj \
            -scheme NotationalUITests \
            -skip-testing:NotationalUITests/NotationalUIPerformanceTests2500 \
            -skip-testing:NotationalUITests/NotationalUIPerformanceTests10000 \
            -skip-testing:NotationalUITests/NotationalUIPerformanceTests25000 \
            -derivedDataPath build/DerivedDataUI \
            -resultBundlePath build/UITestResults.xcresult

      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: ui-test-results
          path: build/UITestResults.xcresult

  # every green push to master replaces the "Latest build" release's download (#49):
  # https://github.com/gsiener/notational/releases/download/latest/Notational.zip
  publish-latest:
    needs: [build, unit-tests, ui-tests]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v7
        with:
          name: Notational
          path: build

      - name: publish
        run: |
          (cd build && shasum -a 256 Notational.zip > Notational.zip.sha256)
          notes="Built from ${GITHUB_SHA::7} (CI run ${{ github.run_number }}, CFBundleVersion 128.${{ github.run_number }}).
          Ad-hoc signed: macOS will warn that it can't verify the developer. See the README to open it."
          if gh release view latest > /dev/null 2>&1; then
            # move the tag instead of deleting the release, so the download link never 404s
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/latest" -f sha="$GITHUB_SHA" -F force=true
            gh release edit latest --title "Latest build" --notes "$notes" --prerelease
            gh release upload latest build/Notational.zip build/Notational.zip.sha256 --clobber
          else
            gh release create latest build/Notational.zip build/Notational.zip.sha256 \
              --target "$GITHUB_SHA" --title "Latest build" --notes "$notes" --prerelease
          fi
