---
name: release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
      - name: build app
        run: scripts/build.sh
      - name: test
        run: scripts/test.sh
      - name: verify app
        run: scripts/verify.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Notational
          path: build/Notational.zip
      - name: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          shasum -a 256 build/Notational.zip | sed 's#build/##' > build/Notational.zip.sha256
          gh release create "$GITHUB_REF_NAME" build/Notational.zip build/Notational.zip.sha256 \
            --repo "$GITHUB_REPOSITORY" --title "Notational $GITHUB_REF_NAME" --generate-notes
