---
name: release

permissions:
  contents: write

on:
  push:
    tags:
      - 'v*'

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v6
        with:
          submodules: recursive
      - name: build app
        run: scripts/build.sh
      # after the build: the Markup renderer's golden-file tests use the bundled multimarkdown
      - name: test
        run: scripts/test.sh
      - name: verify app
        run: scripts/verify.sh
      - uses: actions/upload-artifact@v7
        with:
          name: Notational
          path: build/Notational.zip
      - name: release
        uses: softprops/action-gh-release@v3
        with:
          files: |
            build/Notational.zip
